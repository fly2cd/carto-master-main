schema_version: 1
scenario_id: urban-flood-risk
version: 1.0.0
business_scene: emergency_mapping
tasks:
- hazard-result-map
owned_segments:
- scenario
- data
- spatial-behavior
- portrayal
- delivery
- quality-gates
embedded:
  identity:
    schema_version: 1
    identity_id: neutral-emergency
    version: 1.0.0
    organization: Synthetic Cartography Workspace
    colors:
    - role: primary
      hex: '#1F4E79'
      provenance:
        source_type: derived
        source_ref: template-brief:urban-flood-risk-brief
        version: 1.0.0
        retrieved_at: '2026-09-21T00:00:00Z'
        classification: internal
    typography:
    - role: body
      family: Noto Sans CJK SC
      weight: 400
    attribution:
      organization_format: 'Cartography: {organization}'
      data_source_format: 'Synthetic source: {source}'
    rules:
    - &id001
      id: synthetic-preview-only
      strength: hard_rule
      path: /application/excluded_uses
      description: Draft package is limited to synthetic engineering previews and
        is not a published product.
      value: true
  cartography:
    schema_version: 1
    style_id: flood-risk-technical
    version: 1.0.0
    visual_language: technical
    symbolization:
      color_system: sequential
      symbol_catalogs:
      - ramps/flood-risk@1.0.0
      - symbols/shelter@1.0.0
      default_opacity: 0.82
    labeling:
      density: medium
      collision_policy: prioritize
      font_role: body
    generalization:
      scale_dependent: true
      strategy: simplify
    defaults:
      line_width_mm: 0.2
      point_size_mm: 3.0
      opacity: 0.82
    rules:
    - *id001
  layout:
    schema_version: 1
    layout_id: a3-landscape
    version: 1.0.0
    category: report
    canvas:
      width: 420
      height: 297
      unit: mm
      orientation: landscape
      safe_margin: 10
    frames:
    - id: main-map
      type: map
      coordinate_space: page
      bounds:
      - 15
      - 28
      - 310
      - 250
      overflow_policy: clip
    - id: legend
      type: legend
      coordinate_space: page
      bounds:
      - 330
      - 55
      - 75
      - 170
      overflow_policy: reject
    - id: map-title
      type: title
      coordinate_space: page
      bounds:
      - 15
      - 10
      - 390
      - 14
      overflow_policy: shrink
    placeholders:
    - '{{MAP_TITLE}}'
    - '{{MAP_FRAME}}'
    - '{{LEGEND}}'
    capacity:
      legend_items: 12
      title_characters: 40
    rules:
    - *id001
replaceable_segments:
- identity
- cartography
- layout
data_role_refs:
- risk-area
- shelter-point
target_ids:
- a3-svg
- a3-pdf
- a3-png
application:
  supported_uses:
  - engineering-preview
  excluded_uses:
  - navigation
  - formal-delivery
compatibility:
  target_profiles:
  - a3-landscape
  placeholders:
  - '{{MAP_TITLE}}'
  - '{{MAP_FRAME}}'
  - '{{LEGEND}}'
rules:
- *id001
