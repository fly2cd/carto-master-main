schema_version: 1
version: 1.5.0
default: deny
# Admission is default-deny: only profiles listed here (with a whitelisted code
# implementation) enable create-template/generate-map. Data types, expressions and
# backends are not business scenes; this profile registers one statable purpose
# (standard thematic mapping) at the same level as the catalogued purpose scenes.
profiles:
  - id: general-thematic-mapping
    version: 3.0.0
    implementation: general-thematic
    routes:
      - create-template
      - generate-map
    # Geometry is a data-axis strategy inside one bundle, not a second scenario.
    # The vector strategy is code-ready but withheld from production until a
    # profile admits it (capability-roadmap: variant-geometry-adapter-unification).
    allowed_geometries:
      - raster
    template:
      kind: map-scenario
      id: general-thematic-map
      version: 3.0.0
    authoring_profile: general-thematic-authoring
    request_schemas:
      create-template: general-template-create-request
      generate-map: general-generate-request
    intent_constraints:
      business_scene: general_thematic_mapping
      allowed_tasks:
        - thematic-map
      allowed_theme_tags:
        - administrative-division
        - economic-development
        - technology-innovation
        - modern-industry
        - opening-up
        - culture-tourism
        - transportation
        - landslide
        - flood
        - forest-fire
        - land-cover
      required_theme_tags: []
    data_nature: user-provided
    production_enabled: false
    notice: "通用专题图：依据用户提供的数据编制，未经业务审定"
    licenses:
      - user-declared-source-license
    output_profile:
      width_mm: 297
      height_mm: 210
      dpi: 300
      width_px: 3508
      height_px: 2480
    output_constraints:
      max_width_mm: 420
      max_height_mm: 297
      min_dpi: 150
      max_dpi: 300
      allowed_formats: [pdf, png]
      cmyk_supported: false
    layout_constraints:
      allowed_models: [grid]
      grid:
        max_rows: 2
        max_columns: 2
        allowed_shapes: [1×1, 1×2, 2×2]
    internal_field_names: []
