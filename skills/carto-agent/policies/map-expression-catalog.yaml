schema_version: 1
catalog_id: carto-map-expressions
version: 2.0.0
# Constraint authority: validation.rules is the ONLY place where allowed sets and
# numeric ranges are declared. parameter_definitions carries name/type/required/default
# only. Duplicating constraints there has no consumer and drifts from the enforced copy.
# field_requirements.minimum/maximum are a DIFFERENT concept (data value domain) and stay.
entries:
- schema_version: 1
  expression_id: choropleth/sequential
  version: 1.0.0
  title: Sequential choropleth
  status: deprecated
  superseded_by: graduated-color
  geometry_types:
  - polygon
  field_requirements:
  - semantic_role: thematic-value
    value_type: number
    required: true
    nullable: true
  parameter_definitions:
  - name: classification-method
    type: enum
    required: true
    default: quantile
  - name: class-count
    type: integer
    required: true
    default: 5
  visual_variables:
  - variable: fill-color
    source_role: thematic-value
    algorithm_id: sequential-classification
  legend:
    type: classed-color
    show_no_data: true
    label_source: class-breaks
  missing_value_policy: explicit-symbol
  outlier_policy: clip-to-domain
  checker_refs:
  - id: protocol.schema-valid
    version: 1.0.0
  validation:
    rules:
    - name: parameter_enum
      param: classification-method
      allowed:
      - equal-interval
      - quantile
      - jenks
      - manual
    - name: parameter_range
      param: class-count
      min: 2
      max: 12
  fixture:
    kind: tabular_data
- schema_version: 1
  expression_id: proportional-symbol/count
  version: 1.0.0
  title: Count proportional symbols
  status: deprecated
  superseded_by: proportional-symbol
  geometry_types:
  - point
  field_requirements:
  - semantic_role: count-value
    value_type: number
    required: true
    nullable: false
    minimum: 0
  parameter_definitions:
  - name: minimum-size-mm
    type: number
    required: true
    default: 2
  - name: maximum-size-mm
    type: number
    required: true
    default: 12
  visual_variables:
  - variable: symbol-area
    source_role: count-value
    algorithm_id: area-proportional-scaling
  legend:
    type: graduated-size
    show_no_data: true
    label_source: representative-values
  missing_value_policy: explicit-symbol
  outlier_policy: clip-to-domain
  checker_refs:
  - id: protocol.schema-valid
    version: 1.0.0
  validation:
    rules:
    - name: parameter_range
      param: minimum-size-mm
      min: 0.1
      max: 50
    - name: parameter_range
      param: maximum-size-mm
      min: 0.1
      max: 50
    - name: parameter_relation
      param_a: minimum-size-mm
      param_b: maximum-size-mm
      relation: less_than_or_equal
  fixture:
    kind: point_data
- schema_version: 1
  expression_id: raster/categorical
  version: 1.0.0
  title: Categorical raster portrayal
  status: deprecated
  superseded_by: categorical
  geometry_types:
  - raster
  field_requirements:
  - semantic_role: category-value
    value_type: number
    required: true
    nullable: true
  parameter_definitions: []
  visual_variables:
  - variable: fill-color
    source_role: category-value
    algorithm_id: categorical-lookup
  legend:
    type: categorical-color
    show_no_data: false
    label_source: category-labels
  missing_value_policy: reject
  outlier_policy: reject
  checker_refs:
  - id: protocol.schema-valid
    version: 1.0.0
  validation:
    rules:
    - name: class_count_range
      min: 2
      max: 12
  fixture:
    kind: categorical_legend_csv
    max_bytes: 65536
    encoding: utf-8
    columns:
    - name: category_value
      type: integer
      min: -2147483648
      max: 4294967295
      unique: true
    - name: category_label
      type: string
      min_length: 1
      max_length: 256

- schema_version: 1
  expression_id: vector/explicit
  version: 1.0.0
  title: Explicit standard vector encodings
  status: deprecated
  superseded_by: categorical
  geometry_types: [vector]
  field_requirements: []
  parameter_definitions: []
  visual_variables:
  - variable: fill-color
    source_role: thematic-value
    algorithm_id: explicit-vector-encoding
  legend:
    type: categorical-color
    show_no_data: true
    label_source: category-labels
  missing_value_policy: explicit-symbol
  outlier_policy: reject
  checker_refs:
  - id: protocol.schema-valid
    version: 1.0.0
  validation:
    rules:
    - name: explicit_encoding_defined
  fixture:
    kind: vector_feature_collection
- schema_version: 1
  expression_id: categorical
  version: 2.0.0
  title: Categorical portrayal
  status: active
  applicable_geometry:
  - raster
  - vector
  - line
  field_requirements:
  - semantic_role: category-value
    value_type: number
    required: true
    nullable: true
  parameter_definitions: []
  visual_variables:
  - variable: fill-color
    source_role: category-value
    algorithm_id: categorical-lookup
  legend:
    type: categorical-color
    show_no_data: true
    label_source: category-labels
  missing_value_policy: explicit-symbol
  outlier_policy: reject
  checker_refs:
  - id: protocol.schema-valid
    version: 1.0.0
  validation:
    rules:
    - name: class_count_range
      min: 2
      max: 12
  fixture:
    kind: categorical_data
  adapters:
    raster:
      algorithm_id: categorical-lookup
      fixture_kind: categorical_legend_csv
      max_bytes: 65536
      encoding: utf-8
      columns:
      - name: category_value
        type: integer
        min: -2147483648
        max: 4294967295
        unique: true
      - name: category_label
        type: string
        min_length: 1
        max_length: 256
    vector:
      algorithm_id: explicit-vector-encoding
      fixture_kind: vector_feature_collection
