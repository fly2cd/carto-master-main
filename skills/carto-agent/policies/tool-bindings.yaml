schema_version: 1
registry_id: carto-tool-bindings
version: 1.1.0
default: deny
bindings:
  - capability_id: local-file-read
    version: 1.0.0
    adapter: local
    effect: read
    authorization_policy: project-source-read
    path_guard_required: true
    credential_mode: none
    snapshot_policy: required
  - capability_id: schema-validate
    version: 1.0.0
    adapter: local
    effect: transform
    authorization_policy: protocol-validation
    path_guard_required: true
    credential_mode: none
    snapshot_policy: receipt-only
  - capability_id: renderer-capability-register
    version: 1.0.0
    adapter: local
    effect: read
    authorization_policy: environment-probe
    path_guard_required: false
    credential_mode: none
    snapshot_policy: receipt-only
  - capability_id: web-map-preview
    version: 1.0.0
    adapter: local
    effect: transform
    authorization_policy: renderer-preview
    path_guard_required: true
    credential_mode: none
    snapshot_policy: required
  - capability_id: web-map-export
    version: 1.0.0
    adapter: local
    effect: write-project
    authorization_policy: renderer-export
    path_guard_required: true
    credential_mode: none
    snapshot_policy: required
  - capability_id: svg-compose
    version: 1.0.0
    adapter: local
    effect: write-project
    authorization_policy: svg-composition
    path_guard_required: true
    credential_mode: none
    snapshot_policy: required
  - capability_id: gis-raster-info
    version: 1.0.0
    adapter: mcp
    effect: read
    authorization_policy: project-gis-info
    path_guard_required: true
    credential_mode: none
    snapshot_policy: required
  - capability_id: gis-raster-statistics
    version: 1.0.0
    adapter: mcp
    effect: read
    authorization_policy: project-gis-statistics
    path_guard_required: true
    credential_mode: none
    snapshot_policy: required
  - capability_id: gis-raster-reproject
    version: 1.0.0
    adapter: mcp
    effect: write-project
    authorization_policy: project-gis-reproject
    path_guard_required: true
    credential_mode: none
    snapshot_policy: required
unregistered_capability: reject
