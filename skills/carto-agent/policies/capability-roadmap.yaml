  - id: image-material-frame-binding
    status: backlog
    target: 待定
    note: 无地理语义的图片素材(插画/海报背景/装饰图)经冻结 image material 绑定 layout frame 接入版面。组件级接入模式与 chart 同构(独立 schema + content_id 绑 frame + layer_stack 绘制序),不是新的 geometry 数据形态,也不进数据准备流程(素材通道:字节冻结+处理证据;压缩等变换须留输入/参数/输出摘要)。当前 layout.frames[].type 无 image 类、content_id 只绑 view/overlay,故明确拒绝;开放须补协议三件套。
