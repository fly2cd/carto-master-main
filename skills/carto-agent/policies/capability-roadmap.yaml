schema_version: 1
version: 1.0.1
# Declared not-implemented queue. Guards may raise admission_class=not_implemented
# ONLY for features listed here with status planned/backlog. Safety rejects
# (unknown backend, arbitrary code, symlink, unknown fields) stay forbidden and
# must NOT appear here.
