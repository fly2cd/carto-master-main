- '{{TITLE_TEXT}}'
- '{{SUBTITLE_TEXT}}'
- '{{LOCATION_LABEL}}'
- '{{LEGEND_LABEL}}'
- '{{STATS_LABEL}}'
- '{{COORD_LABEL}}'
- '{{SOURCE_TEXT}}'
- '{{DATE_TEXT}}'
capacity:
  legend_items: 8
  title_characters: 40
rules:
- id: synthetic-preview-only
  strength: hard_rule
  path: /application/excluded_uses
  description: Draft package is limited to synthetic engineering previews and is not
    a published product.
