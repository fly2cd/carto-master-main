schema_version: 1
style_id: yunnan-dem-3d-style
version: 0.1.0
visual_language: editorial
symbolization:
  color_system: sequential
  symbol_catalogs:
  - ramps/dem@1.0.0
  default_opacity: 1.0
labeling:
  density: medium
  collision_policy: avoid
  font_role: label
generalization:
  scale_dependent: false
  strategy: simplify
defaults:
  line_width_mm: 0.3
  point_size_mm: 2.0
  opacity: 1.0
symbol_definitions:
- symbol_id: dem-elevation-fill
  symbol_type: fill
  geometry_types:
  - polygon
  channels:
    fill_color:
      source: expression-output
      ramp_ref: ramps/dem@1.0.0
      property: elevation
    fill_opacity:
      source: fixed
      value: 1.0
    outline_color:
      source: fixed
      value: '#E0E0E0'
    outline_width:
      source: fixed
      value: 0.8
- symbol_id: water-body-line
  symbol_type: line
  geometry_types:
  - line
  channels:
    line_color:
      source: fixed
      value: '#5B8FB9'
    line_width:
      source: fixed
      value: 0.3
    line_opacity:
      source: fixed
      value: 0.8
- symbol_id: city-marker
  symbol_type: marker
  geometry_types:
  - point
  channels:
    marker_color:
      source: fixed
      value: '#FFFFFF'
    marker_size:
      source: fixed
      value: 2.5
- symbol_id: place-name-label
  symbol_type: label
  geometry_types:
  - point
  channels:
    label_field:
      source: property
      property: name
    label_color:
      source: fixed
      value: '#333333'
    label_size:
      source: fixed
      value: 9
- symbol_id: neighbor-region-label
  symbol_type: label
  geometry_types:
  - point
  channels:
    label_field:
      source: property
      property: name
    label_color:
      source: fixed
      value: '#888888'
    label_size:
      source: fixed
      value: 11
- symbol_id: location-highlight-fill
  symbol_type: fill
  geometry_types:
  - polygon
  channels:
    fill_color:
      source: fixed
      value: '#D32F2F'
    fill_opacity:
      source: fixed
      value: 1.0
    outline_color:
      source: fixed
      value: '#CCCCCC'
    outline_width:
      source: fixed
      value: 0.2
rules:
- id: synthetic-preview-only
  strength: hard_rule
  path: /application/excluded_uses
  description: Draft package is limited to synthetic engineering previews and is not
    a published product.
  value: true
