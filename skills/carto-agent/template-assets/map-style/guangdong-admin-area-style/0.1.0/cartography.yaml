schema_version: 2
style_id: guangdong-admin-area-style
version: 0.1.0
visual_language: editorial
symbolization:
  color_system: qualitative
  symbol_catalogs:
  - fills/admin@1.0.0
  - markers/places@1.0.0
  default_opacity: 1.0
labeling:
  density: high
  collision_policy: allow-explicit
  font_role: label
generalization:
  scale_dependent: false
  strategy: simplify
defaults:
  line_width_mm: 0.5
  point_size_mm: 2.5
  opacity: 1.0
rules:
- id: synthetic-preview-only
  strength: hard_rule
  path: /application/excluded_uses
  description: Draft package is limited to synthetic engineering previews and is not
    a published product.
  value: true
typography:
  title_pt: 18
  body_pt: 9
  legend_pt: 10
  legend_heading_pt: 11
  line_spacing: 1.25
