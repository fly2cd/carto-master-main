schema_version: 2
style_id: putuo-cultural-tourism-style
version: 0.1.0
visual_language: narrative
symbolization:
  color_system: mixed
  symbol_catalogs:
  - illustration/hand-drawn@1.0.0
  default_opacity: 0.95
labeling:
  density: medium
  collision_policy: avoid
  font_role: label
generalization:
  scale_dependent: false
  strategy: simplify
defaults:
  line_width_mm: 1.5
  point_size_mm: 4.0
  opacity: 0.9
rules:
- id: synthetic-preview-only
  strength: hard_rule
  path: /application/excluded_uses
  description: Draft package is limited to synthetic engineering previews and is not
    a published product.
  value: true
typography:
  title_pt: 18
  body_pt: 9
  legend_pt: 10
  legend_heading_pt: 11
  line_spacing: 1.25
