schema_version: 1
style_id: putuo-cultural-tourism-style
version: 0.1.0
visual_language: narrative
symbolization:
  color_system: mixed
  symbol_catalogs:
  - illustration/hand-drawn@1.0.0
  default_opacity: 0.95
labeling:
  density: medium
  collision_policy: avoid
  font_role: label
generalization:
  scale_dependent: false
  strategy: simplify
defaults:
  line_width_mm: 1.5
  point_size_mm: 4.0
  opacity: 0.9
symbol_definitions:
- symbol_id: land-use-green
  symbol_type: fill
  geometry_types:
  - polygon
  - multipolygon
  channels:
    fill_color:
      source: fixed
      value: '#A8D5A2'
    fill_opacity:
      source: fixed
      value: 1.0
    outline_color:
      source: fixed
      value: '#FFFFFF'
    outline_width:
      source: fixed
      value: 0.5
- symbol_id: water-body-river
  symbol_type: fill
  geometry_types:
  - polygon
  channels:
    fill_color:
      source: fixed
      value: '#7EC8C8'
    fill_opacity:
      source: fixed
      value: 0.9
- symbol_id: road-network-main
  symbol_type: line
  geometry_types:
  - line
  channels:
    line_color:
      source: fixed
      value: '#FFFFFF'
    line_width:
      source: fixed
      value: 2.5
    line_opacity:
      source: fixed
      value: 1.0
- symbol_id: poi-illustration-marker
  symbol_type: marker
  geometry_types:
  - point
  channels:
    marker_color:
      source: fixed
      value: '#E07A5F'
    marker_size:
      source: fixed
      value: 5.0
- symbol_id: place-name-label
  symbol_type: label
  geometry_types:
  - point
  channels:
    label_field:
      source: property
      property: name
    label_color:
      source: fixed
      value: '#555555'
    label_size:
      source: fixed
      value: 8
rules:
- id: synthetic-preview-only
  strength: hard_rule
  path: /application/excluded_uses
  description: Draft package is limited to synthetic engineering previews and is not
    a published product.
  value: true
