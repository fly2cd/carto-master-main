schema_version: 1
style_id: kernel-density-sequential-style
version: 0.1.0
visual_language: technical
symbolization:
  color_system: mixed
  symbol_catalogs:
  - ramps/density@1.0.0
  default_opacity: 0.9
labeling:
  density: medium
  collision_policy: avoid
  font_role: label
generalization:
  scale_dependent: true
  strategy: simplify
defaults:
  line_width_mm: 0.3
  point_size_mm: 3.5
  opacity: 0.9
symbol_definitions:
- symbol_id: population-density-fill
  symbol_type: fill
  geometry_types:
  - polygon
  - multipolygon
  channels:
    fill_color:
      source: expression-output
      ramp_ref: ramps/density@1.0.0
      property: density_value
    fill_opacity:
      source: fixed
      value: 0.85
- symbol_id: water-body-fill
  symbol_type: fill
  geometry_types:
  - polygon
  - multipolygon
  channels:
    fill_color:
      source: fixed
      value: '#dceefb'
    fill_opacity:
      source: fixed
      value: 1.0
- symbol_id: admin-boundary-line
  symbol_type: line
  geometry_types:
  - line
  channels:
    line_color:
      source: fixed
      value: '#b0b0b0'
    line_width:
      source: fixed
      value: 0.3
    line_opacity:
      source: fixed
      value: 0.8
- symbol_id: city-marker
  symbol_type: marker
  geometry_types:
  - point
  channels:
    marker_color:
      source: fixed
      value: '#d9534f'
    marker_size:
      source: fixed
      value: 4.0
- symbol_id: city-label
  symbol_type: label
  geometry_types:
  - point
  channels:
    label_field:
      source: property
      property: name
    label_color:
      source: fixed
      value: '#333333'
    label_size:
      source: fixed
      value: 10
- symbol_id: neighbor-label
  symbol_type: label
  geometry_types:
  - polygon
  channels:
    label_field:
      source: property
      property: name
    label_color:
      source: fixed
      value: '#999999'
    label_size:
      source: fixed
      value: 12
rules:
- id: synthetic-preview-only
  strength: hard_rule
  path: /application/excluded_uses
  description: Draft package is limited to synthetic engineering previews and is not
    a published product.
  value: true
