  <!-- ===== Footer: dependencies & invariants ===== -->
  <rect x="40" y="588" width="1330" height="192" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
  <text x="56" y="610" font-size="13" font-weight="bold" fill="#1E293B">依赖关系与核心不变量</text>
  <text x="56" y="632" font-size="10.5" fill="#334155">依赖：W1 →（地基）W2/W3/W4/W5；共享链 W2→W3→W4→W5；W3→W6(A)、W5→W7(B)、W3→W8(C)；W8 与 W9 并行（外部服务，虚线）。</text>
  <text x="56" y="651" font-size="10.5" fill="#334155">最小可验证纵切：W1 → W2 → W3 —— 三步即把"标准专题图"从受限栅格升级为具线/注记的多候选可迭代场景，且每步可在现有准入链独立验收，不需等待场景专属能力。</text>
  <text x="56" y="670" font-size="10.5" fill="#334155">共享底座判定（从统一维度矩阵机械读出）：三场景全★ = M1/M2/M3/E5；双场景共享 = E1a线要素(A+C)、E1b文档OCR(B+C)、E6图表核心(B+C)。</text>
  <text x="56" y="689" font-size="10.5" fill="#334155">边界红线：求路/地理编码属网络分析·外部 GIS 服务，走 G1 独立准入，制图侧只渲染已核验路线几何（E1a），不实现路径计算；点密度/KDE/等值线/cartogram/流向OD/地形/栅格代数/overlay/dasymetric/栅格矢量化等空间分析不在本路线图。</text>
  <text x="56" y="708" font-size="10.5" fill="#334155">核心不变量：执行层保留 raster/vector 分离（ADR-001 §9.3）；T1/TP/G1/G2/G3、运行级单写锁、HMAC 回执、确定性重放不变；实现根仅 skills/carto-agent/，不建第二套。</text>
  <text x="56" y="727" font-size="10.5" fill="#334155">通用准入证据：Schema Draft 2020-12 + 未知字段拒绝 · 合法/非法样例 + 自动测试三件套 · 策略入 policies/ 并登记注册表 · capability-roadmap.yaml 翻状态并移除 guard · 合成回归≠真实验收 · 零回归。</text>
  <text x="56" y="746" font-size="10.5" fill="#475569">依据文档：doc/全要素制图能力补齐路线图.md（本图为其 §5 波次序列的可视化）；现状盘点见该路线图 §3 统一维度矩阵。</text>
  <text x="56" y="765" font-size="10.5" fill="#475569">评估视角：目标视角（点/线/面全要素制图），不以当前代码能力为门槛；每个 W 节点的牵引代码位置与特有准入证据见路线图 §4。</text>
</svg>
