  <text x="1030" y="530" font-size="10" fill="#3c4350">受信目录: map_expression_catalog</text>
  <text x="170" y="552" font-size="9.5" fill="#6b7280">栅格渲染链是横切流而非独立模块: workflow(raster_preparation)→compiler(raster_portrayal)→adapters(raster_*_renderer)→map_final_check</text>

