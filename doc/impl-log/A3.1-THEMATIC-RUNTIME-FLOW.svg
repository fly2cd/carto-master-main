<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1460" viewBox="0 0 1200 1460" font-family="'Segoe UI', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#5b6472"/>
    </marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a919c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1460" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="bold" fill="#1f2328">A3.1 标准专题地图（矢量）制作运行流程</text>
  <text x="40" y="58" font-size="11.5" fill="#555b63">依据当前 A3.1 实现绘制 · 2026-11-13 · 垂直单列主流程 + 右侧专题逻辑细节 · amber=审批门禁 · 红字=拒绝路径 · 虚线=数据/引用流</text>

  <!-- 模板准备（前置横条） -->
  <rect x="40" y="72" width="1120" height="56" rx="10" fill="#eef4ee" stroke="#7fa37f"/>
  <text x="56" y="94" font-size="11" font-weight="bold" fill="#1f2328">模板准备（create-template · 一次性前置）</text>
  <text x="56" y="114" font-size="9.5" fill="#3c4350">GeneralVectorAuthor.author（模板包 4.0.0，portrayal.expression_options = categorical / choropleth / proportional）→ validate（合成样张真实渲染冻结）→ TP 审批 → publish 不可变模板 general-thematic-map@4.0.0</text>
  <line x1="405" y1="128" x2="405" y2="186" stroke="#8a919c" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ard)"/>
  <text x="415" y="162" font-size="9" fill="#8a919c">模板引用</text>

  <!-- 阶段① 接入与授权 -->
  <rect x="40" y="160" width="1120" height="252" rx="10" fill="#f7f8fa" stroke="#d3d8e0"/>
  <text x="56" y="180" font-size="12" font-weight="bold" fill="#1f2328">① 接入与授权</text>
  <rect x="240" y="190" width="330" height="56" rx="6" fill="#eef1fb" stroke="#7a89c9"/>
  <text x="405" y="210" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1f2328">generate-request（矢量专题请求）</text>
  <text x="405" y="226" font-size="8.5" text-anchor="middle" fill="#3c4350">geometry=vector · template general-thematic-map@4.0.0</text>
  <text x="405" y="239" font-size="8.5" text-anchor="middle" fill="#3c4350">vector_sources(几何+属性表) · vector_panels[].design</text>
  <line x1="405" y1="246" x2="405" y2="256" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="240" y="258" width="330" height="48" rx="6" fill="#e8f0fb" stroke="#6f93c4"/>
  <text x="405" y="278" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1f2328">准入分派</text>
  <text x="405" y="294" font-size="8.5" text-anchor="middle" fill="#3c4350">geometry_of_request→vector · for_template(4.0.0) · require_geometry</text>
  <line x1="405" y1="306" x2="405" y2="316" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="240" y="318" width="330" height="40" rx="6" fill="#e8f0fb" stroke="#6f93c4"/>
  <text x="405" y="342" font-size="10" text-anchor="middle" fill="#1f2328">意图解析 MapIntent → intake → brief（执行范围）</text>
  <line x1="405" y1="358" x2="405" y2="368" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="290" y="370" width="230" height="36" rx="18" fill="#fff3c4" stroke="#a66a00" stroke-width="1.6"/>
  <text x="405" y="393" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#7a4d00">G1 · approve-map-brief</text>

  <!-- 阶段② 数据准备 -->
  <line x1="405" y1="406" x2="405" y2="446" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="420" width="1120" height="112" rx="10" fill="#f7f8fa" stroke="#d3d8e0"/>
  <text x="56" y="440" font-size="12" font-weight="bold" fill="#1f2328">② 数据准备（compile 内）</text>
  <rect x="240" y="448" width="330" height="72" rx="6" fill="#eef1fb" stroke="#7a89c9"/>
  <text x="405" y="468" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1f2328">MapDataPreparer</text>
  <text x="405" y="484" font-size="8.5" text-anchor="middle" fill="#3c4350">VectorPreparationService 读矢量几何</text>
  <text x="405" y="498" font-size="8.5" text-anchor="middle" fill="#3c4350">join_attributes 属性表 · material→data_facts</text>
  <text x="405" y="512" font-size="8.5" text-anchor="middle" fill="#3c4350">→ bundle(role_bindings + data_facts)</text>
  <line x1="570" y1="484" x2="598" y2="484" stroke="#8a919c" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ard)"/>
  <rect x="600" y="448" width="548" height="76" rx="6" fill="#ffffff" stroke="#c6ccd6"/>
  <text x="612" y="466" font-size="9.5" font-weight="bold" fill="#1f2328">join_attributes（精确字符串键 join）</text>
  <text x="612" y="483" font-size="9" fill="#3c4350">· 几何 key ↔ 属性表 CSV key，键须唯一非空</text>
  <text x="612" y="498" font-size="9" fill="#3c4350">· 表漂移检测 THEMATIC_TABLE_DRIFT（比对 approved bytes）</text>
  <text x="612" y="513" font-size="9" fill="#3c4350">· 全覆盖(未匹配行不静默丢) · 不覆盖已有属性 · 缺失按策略拒绝</text>

  <!-- 阶段③ 设计解析 -->
  <line x1="405" y1="520" x2="405" y2="566" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="540" width="1120" height="112" rx="10" fill="#f7f8fa" stroke="#d3d8e0"/>
  <text x="56" y="560" font-size="12" font-weight="bold" fill="#1f2328">③ 专题设计解析（Planner）</text>
  <rect x="240" y="568" width="330" height="72" rx="6" fill="#eef1fb" stroke="#7a89c9"/>
  <text x="405" y="588" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1f2328">vector_views → resolve_design</text>
  <text x="405" y="604" font-size="8.5" text-anchor="middle" fill="#3c4350">逐 panel 解析专题设计</text>
  <text x="405" y="618" font-size="8.5" text-anchor="middle" fill="#3c4350">指标/归一化/分级/比例/类别</text>
  <text x="405" y="632" font-size="8.5" text-anchor="middle" fill="#3c4350">→ plan.decisions.thematic_views</text>
  <line x1="570" y1="604" x2="598" y2="604" stroke="#8a919c" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ard)"/>
  <rect x="600" y="556" width="548" height="100" rx="6" fill="#ffffff" stroke="#c6ccd6"/>
  <text x="612" y="574" font-size="9.5" font-weight="bold" fill="#1f2328">resolve_design（语义声明 → 确定性算法执行，不猜方法/单位）</text>
  <text x="612" y="591" font-size="9" fill="#3c4350">· metric_value：指标 + 归一化（密度 = 值 / 面积）</text>
  <text x="612" y="606" font-size="9" fill="#3c4350">· choropleth：equal-interval 从 min/max 算 edges，或 manual 显式</text>
  <text x="612" y="621" font-size="9" fill="#3c4350">· proportional：半径按值缩放（count 禁归一化）· categorical：类别→符号</text>
  <text x="612" y="636" font-size="9" fill="#3c4350">· expression_reference：方法→表达目录（choropleth→graduated-color）</text>
  <text x="612" y="651" font-size="9" fill="#3c4350">· 常量域拒绝 · out_of_range=reject · 语义决定与算法执行分离</text>

  <!-- 阶段④ 候选编译 -->
  <line x1="405" y1="640" x2="405" y2="686" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="660" width="1120" height="132" rx="10" fill="#f7f8fa" stroke="#d3d8e0"/>
  <text x="56" y="680" font-size="12" font-weight="bold" fill="#1f2328">④ 候选编译（CandidateCompiler）</text>
  <rect x="240" y="688" width="330" height="96" rx="6" fill="#eef1fb" stroke="#7a89c9"/>
  <text x="405" y="708" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1f2328">compile 确定性编译</text>
  <text x="405" y="724" font-size="8.5" text-anchor="middle" fill="#3c4350">重算 expected_views，验证 plan 一致</text>
  <text x="405" y="738" font-size="8.5" text-anchor="middle" fill="#3c4350">表达准入 → VectorPortrayal → RenderScene</text>
  <text x="405" y="752" font-size="8.5" text-anchor="middle" fill="#3c4350">execution(+material_facts_refs</text>
  <text x="405" y="766" font-size="8.5" text-anchor="middle" fill="#3c4350">+thematic_plan_ref) → execution_digest</text>
  <line x1="570" y1="736" x2="598" y2="736" stroke="#8a919c" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ard)"/>
  <rect x="600" y="688" width="548" height="88" rx="6" fill="#fff5f5" stroke="#c98a8a"/>
  <text x="612" y="706" font-size="9.5" font-weight="bold" fill="#b4232a">计划-数据一致性防漂移（失败即拒绝）</text>
  <text x="612" y="723" font-size="9" fill="#3c4350">· 编译时重算 expected_views = vector_views()</text>
  <text x="612" y="738" font-size="9" fill="#b4232a">· plan.thematic_views ≠ expected_views → THEMATIC_PLAN_DRIFT</text>
  <text x="612" y="753" font-size="9" fill="#b4232a">· expression_ref ∉ 模板 expression_options → 拒绝</text>
  <text x="612" y="768" font-size="9" fill="#3c4350">· execution 绑定 material_facts_refs + thematic_plan_ref</text>

  <!-- 阶段⑤ 预览·审图·冻结 -->
  <line x1="405" y1="784" x2="405" y2="826" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="800" width="1120" height="182" rx="10" fill="#f7f8fa" stroke="#d3d8e0"/>
  <text x="56" y="820" font-size="12" font-weight="bold" fill="#1f2328">⑤ 预览 · 审图 · 冻结</text>
  <rect x="240" y="828" width="330" height="44" rx="6" fill="#e8f0fb" stroke="#6f93c4"/>
  <text x="405" y="848" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1f2328">preview 真实渲染预览</text>
  <text x="405" y="862" font-size="8.5" text-anchor="middle" fill="#3c4350">→ preview evidence（绑定候选）</text>
  <line x1="405" y1="872" x2="405" y2="882" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="290" y="884" width="230" height="36" rx="18" fill="#fff3c4" stroke="#a66a00" stroke-width="1.6"/>
  <text x="405" y="907" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#7a4d00">G2 · approve-freeze</text>
  <line x1="405" y1="920" x2="405" y2="930" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="240" y="932" width="330" height="44" rx="6" fill="#e8f0fb" stroke="#6f93c4"/>
  <text x="405" y="952" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1f2328">freeze → MapSpecLock</text>
  <text x="405" y="966" font-size="8.5" text-anchor="middle" fill="#3c4350">冻结 execution + 全部依赖（不可变）</text>
  <line x1="570" y1="954" x2="598" y2="954" stroke="#8a919c" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ard)"/>
  <rect x="600" y="900" width="548" height="76" rx="6" fill="#fff8ef" stroke="#d29a4b"/>
  <text x="612" y="918" font-size="9.5" font-weight="bold" fill="#1f2328">失效传播（execution_digest 为锚点）</text>
  <text x="612" y="935" font-size="9" fill="#3c4350">· 改数据/属性表/素材/设计 → execution_digest 变</text>
  <text x="612" y="950" font-size="9" fill="#b4232a">· 旧锁 render → LOCK_INPUT_DRIFT（内部 CANDIDATE_DRIFT）</text>
  <text x="612" y="965" font-size="9" fill="#3c4350">· 强制新候选 + 新 G2，不用旧证据批准新设计</text>

  <!-- 阶段⑥ 输出·终检·审查·交付 -->
  <line x1="405" y1="976" x2="405" y2="1016" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="990" width="1120" height="304" rx="10" fill="#f7f8fa" stroke="#d3d8e0"/>
  <text x="56" y="1010" font-size="12" font-weight="bold" fill="#1f2328">⑥ 输出 · 终检 · 审查 · 交付</text>
  <rect x="240" y="1018" width="330" height="44" rx="6" fill="#e8f0fb" stroke="#6f93c4"/>
  <text x="405" y="1038" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1f2328">render 按锁正式输出</text>
  <text x="405" y="1052" font-size="8.5" text-anchor="middle" fill="#3c4350">PDF / PNG（不再重新设计）</text>
  <line x1="405" y1="1062" x2="405" y2="1072" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="240" y="1074" width="330" height="44" rx="6" fill="#e8f0fb" stroke="#6f93c4"/>
  <text x="405" y="1094" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1f2328">check 自动终检</text>
  <text x="405" y="1108" font-size="8.5" text-anchor="middle" fill="#3c4350">→ validation-report（失败分类）</text>
  <line x1="405" y1="1118" x2="405" y2="1128" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="240" y="1130" width="330" height="48" rx="6" fill="#e8f0fb" stroke="#6f93c4"/>
  <text x="405" y="1150" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1f2328">review 成品审查</text>
  <text x="405" y="1166" font-size="8.5" text-anchor="middle" fill="#3c4350">→ product-review 记录 + DeliveryManifest</text>
  <line x1="405" y1="1178" x2="405" y2="1188" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="290" y="1190" width="230" height="36" rx="18" fill="#fff3c4" stroke="#a66a00" stroke-width="1.6"/>
  <text x="405" y="1213" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#7a4d00">G3 · approve-delivery</text>
  <line x1="405" y1="1226" x2="405" y2="1236" stroke="#5b6472" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="240" y="1238" width="330" height="44" rx="6" fill="#eef4ee" stroke="#7fa37f"/>
  <text x="405" y="1258" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1f2328">deliver 原子提交</text>
  <text x="405" y="1272" font-size="8.5" text-anchor="middle" fill="#3c4350">交付包 map.pdf/png · README · manifest · checksums</text>

  <!-- 图例 -->
  <rect x="40" y="1312" width="22" height="12" rx="3" fill="#eef1fb" stroke="#7a89c9"/>
  <text x="70" y="1322" font-size="10" fill="#3c4350">专题特有逻辑</text>
  <rect x="180" y="1312" width="22" height="12" rx="3" fill="#e8f0fb" stroke="#6f93c4"/>
  <text x="210" y="1322" font-size="10" fill="#3c4350">通用主流程步骤</text>
  <rect x="340" y="1312" width="22" height="12" rx="3" fill="#fff3c4" stroke="#a66a00"/>
  <text x="370" y="1322" font-size="10" fill="#3c4350">审批门禁</text>
  <rect x="470" y="1312" width="22" height="12" rx="3" fill="#eef4ee" stroke="#7fa37f"/>
  <text x="500" y="1322" font-size="10" fill="#3c4350">模板/交付</text>
  <rect x="600" y="1312" width="22" height="12" rx="3" fill="#fff5f5" stroke="#c98a8a"/>
  <text x="630" y="1322" font-size="10" fill="#3c4350">拒绝/失败路径</text>
  <line x1="760" y1="1318" x2="800" y2="1318" stroke="#8a919c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="808" y="1322" font-size="10" fill="#3c4350">数据/引用流</text>

  <!-- 元数据 -->
  <text x="40" y="1356" font-size="9.5" fill="#6b7280">实现依据：scenario-capabilities v1.6.0（general-thematic-vector@4.0.0，allowed_geometries:[vector]）· workflow/thematic.py（resolve_design / metric_value / join_attributes / vector_views）· scenarios/general_vector.py（Planner / CandidateCompiler / Author）</text>
  <text x="40" y="1374" font-size="9.5" fill="#6b7280">表达：categorical · graduated-color(choropleth) · proportional-symbol　|　渲染后端：matplotlib-vector-page　|　门禁：G1(map-brief) · G2(resolved-map) · G3(delivery-manifest)</text>
  <text x="40" y="1392" font-size="9.5" fill="#6b7280">验证：test_a31_thematic 25 tests OK（数据核验 + 模板发布 + 端到端 compile→preview→freeze→render→check→review→deliver + 失效到像素）</text>
  <text x="40" y="1416" font-size="9.5" fill="#b4232a">核心不变量：语义决定（方法/指标/单位/分级）由设计声明，算法执行（归一化/edges/半径/join）由程序确定性完成；execution_digest 是数据/设计变化触发锁失效的唯一锚点。</text>
</svg>
