name: carto-ci

on:
  pull_request:
  push:
    branches: [main, U-P3.7]
  schedule:
    - cron: "0 18 * * *"   # nightly full regression
  workflow_dispatch:

concurrency:
  group: carto-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # PR gate: schema self-check + fast tier (~minutes). Unknown/new test ids always run.
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r skills/carto-agent/requirements.txt
          pip install -r skills/carto-agent/requirements-raster-rendering.txt
          pip install -r skills/carto-agent/requirements-geospatial.txt
          pip install "fiona>=1.10,<2" "shapely>=2.0,<3"
      - name: Reduce font skips (optional, honest about remaining)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk || true
      - name: Schema self-check
        run: python skills/carto-agent/scripts/carto.py schema check
      - name: Fast-tier regression
        run: python skills/carto-agent/scripts/tests/run_tests.py --tier fast --quiet

  # Merge / nightly gate: full regression. Environment-dependent skips (fonts/headless
  # browser/MCP) are legitimate on the runner and are reported, never faked as passes.
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r skills/carto-agent/requirements.txt
          pip install -r skills/carto-agent/requirements-raster-rendering.txt
          pip install -r skills/carto-agent/requirements-geospatial.txt
          pip install "fiona>=1.10,<2" "shapely>=2.0,<3"
      - name: Reduce font skips (optional)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk || true
      - name: Schema self-check
        run: python skills/carto-agent/scripts/carto.py schema check
      - name: Full-tier regression (merge gate)
        run: python skills/carto-agent/scripts/tests/run_tests.py --tier full